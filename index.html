                { char: "Dokter", type: "A", icon: "💊", action: "Aturan Obat", jp: "じゃ、今日は 薬を 飲んで、早く 寝て ください。", id: "Kalau begitu, hari ini minum obat lalu tidur awal.", rm: "Ja, kyou wa kusuri o nonde, hayaku nete kudasai." },
                { char: "Matsumoto", type: "B", icon: "✅", action: "Ya", jp: "はい。", id: "Baik.", rm: "Hai." },
                { char: "Dokter", type: "A", icon: "🚫", action: "Larangan Mandi", jp: "それから、今晩は お風呂に 入らないで くださいね。", id: "Lalu, malam ini tolong jangan mandi (berendam) ya.", rm: "Sorekara, konban wa ofuro ni hairanaide kudasai ne." },
                { char: "Matsumoto", type: "B", icon: "👤", action: "Paham", jp: "はい、わかりました。", id: "Baik, saya mengerti.", rm: "Hai, wakarimashita." },
                { char: "Dokter", type: "A", icon: "✨", action: "Perpisahan", jp: "じゃ、お大事に。", id: "Semoga lekas sembuh.", rm: "Ja, odaiji ni." },
                { char: "Matsumoto", type: "B", icon: "🙏", action: "Terima Kasih Akhir", jp: "どうも ありがとう ございました。", id: "Terima kasih banyak.", rm: "Doumo arigatou gozaimashita." }
            ]
        }
    };

    let activeKey = 'delay';
    let currentStep = 0;
    let voices = [];

    function loadVoices() { voices = window.speechSynthesis.getVoices(); }
    window.speechSynthesis.onvoiceschanged = loadVoices;

    function speak(text, type) {
        if (!window.speechSynthesis) return;
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'ja-JP';
        const jpVoice = voices.find(v => (v.lang === 'ja-JP' || v.lang === 'ja_JP')) || voices.find(v => v.lang.includes('ja'));
        if (jpVoice) utterance.voice = jpVoice;
        utterance.pitch = type === 'A' ? 0.8 : 1.2;
        utterance.rate = type === 'A' ? 0.85 : 1.0;
        window.speechSynthesis.speak(utterance);
    }

    function changeSkenario(key) {
        activeKey = key;
        currentStep = 0;
        document.querySelectorAll('button[id^="tab-"]').forEach(b => b.classList.remove('tab-active'));
        document.getElementById('tab-' + key).classList.add('tab-active');
        render();
    }

    function handlePlayAudio() {
        const step = database[activeKey].script[currentStep];
        speak(step.jp, step.type);
    }

    function toggleElement(id) {
        const el = document.getElementById(id);
        const rm = document.getElementById('rm-text');
        if (el.classList.contains('hidden-content')) {
            el.classList.remove('hidden-content');
            el.classList.add('show-content');
            if (id === 'id-text') { rm.classList.add('show-content'); rm.classList.remove('hidden-content'); }
        } else {
            el.classList.remove('show-content');
            el.classList.add('hidden-content');
            if (id === 'id-text') { rm.classList.remove('show-content'); rm.classList.add('hidden-content'); }
        }
    }

    function render() {
        const data = database[activeKey];
        const step = data.script[currentStep];
        
        document.getElementById('header-bg').className = `px-8 py-6 text-white transition-all duration-700 shadow-lg relative overflow-hidden ${data.color}`;
        document.getElementById('header-title').innerText = data.title;
        document.getElementById('header-desc').innerText = data.desc;
        document.getElementById('step-indicator').innerText = (currentStep + 1).toString().padStart(2, '0');
        document.getElementById('situation-box').innerText = data.situation;
        document.getElementById('header-icon-large').innerText = data.icon;
        document.getElementById('avatar').innerText = step.icon;
        document.getElementById('char-name').innerText = step.char;
        document.getElementById('action-prompt').innerText = step.action;
        
        const badge = document.getElementById('char-badge');
        badge.innerText = `SUARA TIPE ${step.type}`;
        badge.className = `absolute -top-4 px-6 py-2 rounded-full shadow-lg text-[9px] font-black tracking-[0.3em] text-white ${step.type === 'A' ? 'bg-slate-800' : 'bg-amber-600'}`;

        document.getElementById('jp-text').innerText = step.jp;
        document.getElementById('id-text').innerText = step.id;
        document.getElementById('rm-text').innerText = step.rm;

        // Reset visibility on step change
        ['jp-text', 'id-text', 'rm-text'].forEach(id => {
            document.getElementById(id).classList.add('hidden-content');
            document.getElementById(id).classList.remove('show-content');
        });

        const dots = document.getElementById('dots-container');
        dots.innerHTML = '';
        data.script.forEach((_, i) => {
            const dot = document.createElement('div');
            dot.className = `h-1.5 rounded-full transition-all duration-300 ${i === currentStep ? 'w-8 bg-amber-500' : 'w-1.5 bg-slate-200'}`;
            dots.appendChild(dot);
        });
    }

    function nextStep() {
        if (currentStep < database[activeKey].script.length - 1) {
            currentStep++;
            render();
        } else {
            currentStep = 0;
            render();
        }
    }

    function prevStep() {
        if (currentStep > 0) {
            currentStep--;
            render();
        }
    }

    window.onload = () => {
        loadVoices();
        changeSkenario('delay');
    }
</script>
</body>
</html>
