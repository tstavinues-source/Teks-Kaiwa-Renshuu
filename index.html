<!DOCTYPE html>

<head>

    <title>Penghafal Percakapan Jepang: Skenario Visual Lengkap</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap');
        body { font-family: 'Noto Sans JP', sans-serif; background-color: #f1f5f9; }
        .hidden-content { display: none; }
        .show-content { display: block; animation: slideDown 0.3s ease-out; }
        @keyframes slideDown { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="p-2 md:p-8">

<div class="max-w-xl mx-auto bg-white rounded-3xl shadow-2xl overflow-hidden border border-slate-200">
    <!-- Selector Skenario -->
    <div class="bg-slate-800 p-2 flex flex-wrap justify-around border-b border-slate-700">
        <button onclick="switchSkenario('delay')" id="btn-delay" class="text-[10px] font-bold px-3 py-2 m-1 rounded-full transition bg-amber-600 text-white shadow-lg">⏰ LATE</button>
        <button onclick="switchSkenario('atm')" id="btn-atm" class="text-[10px] font-bold px-3 py-2 m-1 rounded-full transition bg-slate-700 text-slate-300">🏧 ATM</button>
        <button onclick="switchSkenario('parkir')" id="btn-parkir" class="text-[10px] font-bold px-3 py-2 m-1 rounded-full transition bg-slate-700 text-slate-300">🚗 TILANG</button>
        <button onclick="switchSkenario('apartemen')" id="btn-apartemen" class="text-[10px] font-bold px-3 py-2 m-1 rounded-full transition bg-slate-700 text-slate-300">🏢 APARTEMEN</button>
        <button onclick="switchSkenario('klinik')" id="btn-klinik" class="text-[10px] font-bold px-3 py-2 m-1 rounded-full transition bg-slate-700 text-slate-300">🏥 KLINIK</button>
    </div>

    <!-- Header Dynamic -->
    <div id="header-bg" class="bg-amber-600 p-6 text-white text-center transition-colors duration-500">
        <h1 id="header-title" class="text-lg font-bold uppercase tracking-widest text-white">遅れて、すみません</h1>
        <p id="header-desc" class="text-amber-100 text-sm mt-1">Skenario: Terlambat & Memberi Alasan</p>
    </div>

    <!-- Progress -->
    <div class="w-full bg-slate-100 h-1.5">
        <div id="progress" class="bg-yellow-400 h-1.5 transition-all duration-500" style="width: 0%"></div>
    </div>

    <div class="p-6 md:p-8">
        <div id="scene-content" class="min-h-[450px]">
            <!-- Konten diisi JavaScript -->
        </div>
    </div>

    <!-- Navigation -->
    <div class="bg-slate-50 p-4 border-t flex justify-between items-center px-8">
        <button onclick="prevStep()" class="text-slate-400 hover:text-amber-600 font-bold transition">← Back</button>
        <span id="step-indicator" class="text-xs font-mono text-slate-400 bg-slate-200 px-3 py-1 rounded-full">1 / 10</span>
        <button onclick="nextStep()" id="next-btn" class="bg-amber-600 hover:bg-amber-700 text-white px-6 py-2 rounded-xl font-bold shadow-lg transition">Lanjut →</button>
    </div>
</div>

    let activeKey = 'delay';
    let currentStep = 0;

    function switchSkenario(key) {
        activeKey = key;
        currentStep = 0;
        
        const keys = ['delay', 'atm', 'parkir', 'apartemen', 'klinik'];
        keys.forEach(k => {
            const btn = document.getElementById('btn-' + k);
            if (btn) {
                if (k === key) {
                    btn.className = `text-[10px] font-bold px-3 py-2 m-1 rounded-full transition ${data[k].color} text-white shadow-lg`;
                } else {
                    btn.className = "text-[10px] font-bold px-3 py-2 m-1 rounded-full transition bg-slate-700 text-slate-300";
                }
            }
        });
        
        document.getElementById('header-bg').className = `${data[key].color} p-6 text-white text-center transition-colors duration-500`;
        document.getElementById('header-title').innerText = data[key].title;
        document.getElementById('header-desc').innerText = data[key].desc;
        
        renderScene();
    }

    function toggleContent(id) {
        const el = document.getElementById(id);
        el.classList.toggle('hidden-content');
        el.classList.toggle('show-content');
    }

    function renderScene() {

        const scene = script[currentStep];
        const content = document.getElementById('scene-content');

                <div class="flex items-center gap-4 mb-4">
                    <div class="w-14 h-14 bg-slate-50 rounded-2xl flex items-center justify-center text-3xl shadow-inner border border-slate-100">
                        ${scene.icon}
                    </div>
                    <div>
                        <h2 class="text-md font-bold text-slate-800">${scene.char}</h2>
                        <p class="text-[10px] text-indigo-600 font-bold uppercase tracking-tight">Baris ${currentStep + 1} / ${script.length}</p>
                    </div>
                </div>

                <div class="bg-amber-50 border-l-4 border-amber-400 p-4 rounded-r-xl mb-6 shadow-sm">
                    <p class="text-amber-900 font-bold mb-1 text-xs uppercase tracking-tighter">🧠 Konteks:</p>
                    <p class="text-slate-800 text-sm leading-relaxed mb-3">${scene.context}</p>
                    <div class="bg-white/50 p-2 rounded border border-amber-200">
                        <p class="text-amber-700 text-[11px] font-bold">AKSI: <span class="font-normal italic">${scene.action}</span></p>
                    </div>
                </div>

                <div class="space-y-3 mt-auto">
                    <button onclick="toggleContent('jp-text')" class="w-full py-3 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl font-bold transition flex justify-between px-6 border border-slate-200 shadow-sm">
                        <span class="text-sm">CEK BAHASA JEPANG</span>
                        <span>👁️</span>
                    </button>
                    <div id="jp-text" class="hidden-content p-5 bg-indigo-50 rounded-xl text-center border border-indigo-200">
                        <p class="text-2xl font-bold text-indigo-900 leading-relaxed mb-2">${scene.jp}</p>
                        <div class="inline-block px-3 py-1 bg-yellow-300 text-yellow-900 text-[10px] font-bold rounded-full uppercase">Kunci: ${scene.keyword}</div>
                    </div>

                    <button onclick="toggleContent('rm-text')" class="w-full py-2 bg-white hover:bg-slate-50 text-slate-400 rounded-xl text-[10px] font-bold transition flex justify-between px-6 border border-dashed border-slate-300">
                        <span>LIHAT ROMAJI</span>
                        <span>🔡</span>
                    </button>
                    <div id="rm-text" class="hidden-content p-3 bg-slate-50 rounded-xl text-center border border-slate-200">
                        <p class="text-xs font-mono text-slate-500">${scene.romaji}</p>
                    </div>
                </div>
            </div>
        `;

        document.getElementById('progress').style.width = `${((currentStep + 1) / script.length) * 100}%`;
        document.getElementById('step-indicator').innerText = `${currentStep + 1} / ${script.length}`;
        document.getElementById('next-btn').innerText = currentStep === script.length - 1 ? "Ulangi" : "Lanjut";
    }

    function nextStep() {
        const script = data[activeKey].script;
        if (currentStep < script.length - 1) {
            currentStep++;
            renderScene();
        } else {
            currentStep = 0;
            renderScene();
        }
    }

    function prevStep() {
        if (currentStep > 0) {
            currentStep--;
            renderScene();
        }
    }

    window.onload = () => switchSkenario('delay');
</script>

</body>
</html>
