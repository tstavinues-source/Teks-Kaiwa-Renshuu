<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master Percakapan Jepang - 5 Tema Lengkap</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@500;700;900&display=swap');
        body { font-family: 'Noto Sans JP', sans-serif; background-color: #0f172a; -webkit-tap-highlight-color: transparent; }
        .hidden-content { opacity: 0; transform: scale(0.95); pointer-events: none; transition: all 0.3s ease; height: 0; overflow: hidden; }
        .show-content { opacity: 1; transform: scale(1); pointer-events: auto; height: auto; transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); padding: 1.25rem; margin-top: 1rem; }
        .tab-active { background-color: #f59e0b !important; color: white !important; box-shadow: 0 4px 12px rgba(245, 158, 11, 0.4); }
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen bg-slate-900">

<div class="max-w-md w-full bg-slate-50 min-h-screen shadow-2xl flex flex-col relative overflow-hidden md:rounded-[3rem] md:min-h-[850px]">
    
    <!-- Navigation Tabs -->
    <div class="bg-slate-900 pt-6 pb-4 px-4 overflow-x-auto flex gap-2 no-scrollbar sticky top-0 z-50 border-b border-slate-800">
        <button onclick="changeSkenario('delay')" id="tab-delay" class="px-5 py-2 rounded-full text-[10px] font-black text-slate-400 bg-slate-800 transition-all uppercase tracking-widest shrink-0 border border-slate-700">Terlambat</button>
        <button onclick="changeSkenario('atm')" id="tab-atm" class="px-5 py-2 rounded-full text-[10px] font-black text-slate-400 bg-slate-800 transition-all uppercase tracking-widest shrink-0 border border-slate-700">ATM</button>
        <button onclick="changeSkenario('parkir')" id="tab-parkir" class="px-5 py-2 rounded-full text-[10px] font-black text-slate-400 bg-slate-800 transition-all uppercase tracking-widest shrink-0 border border-slate-700">Parkir</button>
        <button onclick="changeSkenario('sampah')" id="tab-sampah" class="px-5 py-2 rounded-full text-[10px] font-black text-slate-400 bg-slate-800 transition-all uppercase tracking-widest shrink-0 border border-slate-700">Sampah</button>
        <button onclick="changeSkenario('klinik')" id="tab-klinik" class="px-5 py-2 rounded-full text-[10px] font-black text-slate-400 bg-slate-800 transition-all uppercase tracking-widest shrink-0 border border-slate-700">Klinik</button>
    </div>

    <!-- Header Area -->
    <div id="header-bg" class="px-8 py-8 text-white transition-all duration-700 shadow-lg">
        <div class="flex justify-between items-start">
            <div>
                <h1 id="header-title" class="text-2xl font-black leading-tight tracking-tight uppercase">...</h1>
                <p id="header-desc" class="text-[10px] opacity-80 font-bold mt-1 uppercase tracking-widest">...</p>
            </div>
            <div id="step-indicator" class="text-4xl font-black opacity-30 tracking-tighter">01</div>
        </div>
    </div>

    <!-- Main Card Content -->
    <div class="flex-grow p-6 flex flex-col -mt-6">
        <div id="card-main" class="bg-white rounded-[2.5rem] p-8 shadow-xl border border-slate-100 min-h-[420px] flex flex-col items-center text-center relative">
            
            <div id="char-badge" class="absolute -top-4 px-6 py-2 rounded-full shadow-lg text-[10px] font-black tracking-[0.2em] text-white">
                MEMUAT...
            </div>

            <div id="avatar" class="w-24 h-24 rounded-3xl bg-slate-50 border-2 border-slate-100 flex items-center justify-center text-5xl mb-6 shadow-inner transition-transform">
                ...
            </div>

            <h2 id="char-name" class="text-xl font-black text-slate-800 mb-1">...</h2>
            <p id="voice-label" class="text-[9px] font-bold text-slate-400 uppercase tracking-widest mb-6 italic">MENGATUR SUARA...</p>

            <!-- Text Display Area -->
            <div class="w-full space-y-4">
                <div id="jp-text" class="hidden-content bg-slate-900 text-white rounded-3xl text-2xl font-bold leading-relaxed shadow-2xl border-b-8 border-amber-500">
                    ...
                </div>
                
                <div id="id-text" class="hidden-content bg-amber-50 border-2 border-amber-100 rounded-2xl text-slate-700 text-sm font-bold italic">
                    ...
                </div>

                <div id="rm-text" class="hidden-content font-mono text-[10px] text-slate-400 bg-slate-50 py-2 rounded-lg tracking-widest uppercase">
                    ...
                </div>
            </div>
        </div>

        <!-- Buttons Area -->
        <div class="mt-8 space-y-4">
            <!-- Listening Button (Audio Only) -->
            <button onclick="handlePlayAudio()" class="w-full py-6 bg-teal-600 hover:bg-teal-700 text-white rounded-[2rem] shadow-xl transition-all active:scale-95 flex items-center justify-center gap-4 group">
                <span class="font-black text-sm uppercase tracking-widest">Dengarkan Suara</span>
                <svg class="w-6 h-6 group-hover:scale-125 transition-transform" fill="currentColor" viewBox="0 0 20 20"><path d="M9.383 3.076A1 1 0 0110 4v12a1 1 0 01-1.707.707L4.586 13H2a1 1 0 01-1-1V8a1 1 0 011-1h2.586l3.707-3.707a1 1 0 011.09-.217z"></path></svg>
            </button>

            <!-- Visibility Buttons -->
            <div class="grid grid-cols-2 gap-4">
                <button onclick="toggleElement('jp-text')" class="py-4 bg-slate-800 text-white rounded-2xl font-black text-[10px] uppercase tracking-widest shadow-lg active:scale-95">
                    Lihat Jepang
                </button>
                <button onclick="toggleElement('id-text')" class="py-4 bg-white border-2 border-slate-200 text-slate-400 rounded-2xl font-black text-[10px] uppercase tracking-widest shadow-md active:scale-95">
                    Arti & Romaji
                </button>
            </div>
        </div>
    </div>

    <!-- Navigation Footer -->
    <div class="p-8 flex justify-between items-center">
        <button onclick="prevStep()" class="w-14 h-14 rounded-full bg-white shadow-md flex items-center justify-center text-slate-300 hover:text-slate-800 active:scale-75 transition-all">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M15 19l-7-7 7-7"/></svg>
        </button>
        
        <div id="dots-container" class="flex gap-2"></div>

        <button onclick="nextStep()" class="w-14 h-14 rounded-full bg-amber-500 shadow-lg shadow-amber-200 flex items-center justify-center text-white active:scale-75 transition-all">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M9 5l7 7-7 7"/></svg>
        </button>
    </div>
</div>

<script>
    const database = {
        delay: { title: "Terlambat", desc: "遅れて、すみません", color: "bg-indigo-600", script: [
            { char: "Miller", type: "B", icon: "🏃‍♂️", jp: "課長、遅れて、すみません。", id: "Kepala bagian, maaf saya terlambat.", rm: "Kachou, okurete, sumimasen." },
            { char: "Kachou", type: "A", icon: "👨‍💼", jp: "ミラーさん、どう したんですか。", id: "Miller-san, ada apa?", rm: "Miraa-san, dou shita n desu ka?" },
            { char: "Miller", type: "B", icon: "🚌", jp: "実は 来る 途中で 事故が あって、バスが 遅れて しまったんです。", id: "Sebenarnya di tengah jalan ada kecelakaan, dan bus terlambat.", rm: "Jitsu wa kuru tochu de jiko ga atte, basu ga okurete shimatta n desu." },
            { char: "Kachou", type: "A", icon: "🏢", jp: "バスの 事故ですか。", id: "Kecelakaan bus?", rm: "Basu no jiko desu ka?" },
            { char: "Miller", type: "B", icon: "🚚", jp: "いいえ。交差点で トラックと 車が ぶつかって、バスが 動かなかったんです。", id: "Bukan. Di persimpangan truk dan mobil tabrakan, bus tidak bisa jalan.", rm: "Iie. Kousaten de torakku to kuruma ga butsukatte..." },
            { char: "Kachou", type: "A", icon: "🤝", jp: "それは 大変でしたね。", id: "Wah, itu sulit ya.", rm: "Sore wa taihen deshita ne." },
            { char: "Miller", type: "B", icon: "📱", jp: "電話したかったんですが、ケータイを うちに 忘れて しまって……。", id: "Saya ingin telepon tapi HP ketinggalan di rumah...", rm: "Denwa shitakatta n desu ga, keetai o wasurete shimatte..." },
            { char: "Kachou", type: "A", icon: "📋", jp: "わかりました。じゃ、会議を 始めましょう。", id: "Mengerti. Mari kita mulai rapatnya.", rm: "Wakarimashita. Ja, kaigi o hajimemashou." }
        ]},
        atm: { title: "ATM", desc: "使い方を 教えて ください", color: "bg-emerald-600", script: [
            { char: "Maria", type: "B", icon: "👩", jp: "すみませんが、ちょっと 使い方を 教えて ください。", id: "Maaf, tolong ajarkan sebentar cara pakainya.", rm: "Sumimasen ga, chotto tsukaikata o..." },
            { char: "Petugas", type: "A", icon: "🏦", jp: "お引き出しですか。", id: "Apakah ingin tarik tunai?", rm: "Ohikidashi desu ka?" },
            { char: "Maria", type: "B", icon: "💳", jp: "はい、お金を 引き出したいんです。", id: "Iya, saya ingin tarik uang.", rm: "Hai, okane o hikidashitai n desu." },
            { char: "Petugas", type: "A", icon: "☝️", jp: "では、まず ここを 押して ください。", id: "Kalau begitu, pertama tekan di sini.", rm: "Dewa, mazu koko o oshite kudasai." },
            { char: "Petugas", type: "A", icon: "🔢", jp: "次に キャッシュカードを 入れて、暗証番号を 押して ください。", id: "Lalu masukkan kartu dan tekan PIN.", rm: "Tsugi ni kyasshu-kaado o irete, anshou-bangou o..." },
            { char: "Maria", type: "B", icon: "❓", jp: "はい、次は どう しますか。", id: "Iya, berikutnya bagaimana?", rm: "Hai, tsugi wa dou shimasu ka?" },
            { char: "Petugas", type: "A", icon: "💰", jp: "金額を 押して、この「確認」ボタンを 押して ください。", id: "Tekan jumlahnya, lalu tekan tombol konfirmasi ini.", rm: "Kingaku o oshite, kono 'kakunin' botan o..." },
            { char: "Maria", type: "B", icon: "🙏", jp: "どうも ありがとう ございました。", id: "Terima kasih banyak.", rm: "Doumo arigatou gozaimashita." }
        ]},
        parkir: { title: "Parkir", desc: "これは どういう 意味ですか", color: "bg-red-600", script: [
            { char: "Watt", type: "B", icon: "👤", jp: "この 漢字は 何と 読むんですか。", id: "Kanji ini dibaca apa?", rm: "Kono kanji wa nan to yomu n desu ka?" },
            { char: "Staf", type: "A", icon: "👮", jp: "「ちゅうしゃいはん」です。", id: "Bacanya 'Chuushaihan' (Pelanggaran Parkir).", rm: "Chuushaihan desu." },
            { char: "Watt", type: "B", icon: "❓", jp: "どういう 意味ですか。", id: "Apa artinya?", rm: "Douiu imi desu ka?" },
            { char: "Staf", type: "A", icon: "🚫", jp: "止めては いけない 場所に 車を 止めたと いう 意味です。", id: "Artinya memarkir mobil di tempat terlarang.", rm: "Tomete wa ikenai basho ni kuruma o tometa..." },
            { char: "Watt", type: "B", icon: "😰", jp: "罰金を 払わなければ なりませんか。", id: "Apakah saya harus bayar denda?", rm: "Bakkin o harawanakereba narimasen ka?" },
            { char: "Staf", type: "A", icon: "💰", jp: "ええ、15,000円 払わないと いけません。", id: "Iya, harus bayar 15.000 yen.", rm: "Ee, ichiman-gosen-en harawanaito ikemasen." }
        ]},
        sampah: { title: "Sampah", desc: "ごみの 出し方", color: "bg-blue-600", script: [
            { char: "Miller", type: "B", icon: "👤", jp: "ごみを 捨てたいんですが、どこに 出したら いいですか。", id: "Saya mau buang sampah, sebaiknya dikeluarkan ke mana?", rm: "Gomi o sutetai n desu ga, doko ni dashitara..." },
            { char: "Pengelola", type: "A", icon: "🏠", jp: "燃える ごみは 月曜日と 木曜日の 朝 出して ください。", id: "Sampah bakar keluarkan Senin & Kamis pagi.", rm: "Moeru gomi wa getsuyoubi to mokuyoubi no asa..." },
            { char: "Miller", type: "B", icon: "❓", jp: "瓶や 缶は いつですか。", id: "Kalau botol dan kaleng kapan?", rm: "Bin ya kan wa itsu desu ka?" },
            { char: "Pengelola", type: "A", icon: "📅", jp: "土曜日です。ごみ置き場は 駐車場の 横です。", id: "Hari Sabtu. Tempat sampahnya di samping parkiran.", rm: "Doyoubi desu. Gomi-okiba wa chuushajou no yoko..." }
        ]},
        klinik: { title: "Klinik", desc: "病院で", color: "bg-teal-600", script: [
            { char: "Dokter", type: "A", icon: "👨‍⚕️", jp: "どう しましたか。", id: "Ada apa? (Apa keluhannya?)", rm: "Dou shimashita ka?" },
            { char: "Matsumoto", type: "B", icon: "🤒", jp: "きのうから のどが 痛くて、熱も 少し あります。", id: "Sejak kemarin tenggorokan sakit, dan sedikit demam.", rm: "Kinou kara nodo ga itakute, netsu mo sukoshi..." },
            { char: "Dokter", type: "A", icon: "👄", jp: "そうですか。ちょっと 口を 開けて ください。", id: "Begitu ya. Tolong buka mulutnya sebentar.", rm: "Sou desu ka. Chotto kuchi o akete kudasai." },
            { char: "Matsumoto", type: "B", icon: "😰", jp: "あの、何の 病気ですか。", id: "Anu, saya sakit apa ya?", rm: "Ano, nan no byouki desu ka?" },
            { char: "Dokter", type: "A", icon: "🤒", jp: "風邪ですね。", id: "Sakit flu ya.", rm: "Kaze desu ne." },
            { char: "Matsumoto", type: "B", icon: "📝", jp: "すみません、病気の 名前を 書いて いただけませんか。", id: "Maaf, bisakah menuliskan nama penyakitnya?", rm: "Sumimasen, byouki no namae o kaite..." },
            { char: "Dokter", type: "A", icon: "✍️", jp: "いいですよ。……はい、どうぞ。", id: "Boleh saja. ...Ini, silakan.", rm: "Ii desu yo. ...Hai, douzo." },
            { char: "Matsumoto", type: "B", icon: "🙏", jp: "ありがとうございます。", id: "Terima kasih banyak.", rm: "Arigatou gozaimasu." },
            { char: "Dokter", type: "A", icon: "🛌", jp: "２、３日 ゆっくり 休んで くださいね。", id: "Istirahatlah dengan tenang selama 2-3 hari ya.", rm: "Ni, san nichi yukkuri yasunde kudasai ne." },
            { char: "Matsumoto", type: "B", icon: "🚅", jp: "あのう、あしたから 東京へ 出張しなければ なりません。", id: "Anu, mulai besok saya harus dinas ke Tokyo.", rm: "Anou, ashita kara Toukyou e shuuchou..." },
            { char: "Dokter", type: "A", icon: "💊", jp: "じゃ、今日は 薬を 飲んで、早く 寝て ください。", id: "Kalau begitu, hari ini minum obat lalu tidur awal.", rm: "Ja, kyou wa kusuri o nonde, hayaku nete..." },
            { char: "Dokter", type: "A", icon: "🚫", jp: "それから、今晩は お風呂に 入らないで くださいね。", id: "Lalu, malam ini tolong jangan mandi (berendam) ya.", rm: "Sorekara, konban wa ofuro ni hairanaide..." },
            { char: "Matsumoto", type: "B", icon: "👤", jp: "はい、わかりました。", id: "Baik, saya mengerti.", rm: "Hai, wakarimashita." },
            { char: "Dokter", type: "A", icon: "✨", jp: "じゃ、お大事に。", id: "Semoga lekas sembuh.", rm: "Ja, odaiji ni." }
        ]}
    };

    let activeKey = 'delay';
    let currentStep = 0;
    let voices = [];

    // Voice Initialization
    function loadVoices() {
        voices = window.speechSynthesis.getVoices();
    }
    window.speechSynthesis.onvoiceschanged = loadVoices;
    loadVoices();

    function speak(text, type) {
        if (!window.speechSynthesis) return;
        window.speechSynthesis.cancel();
        
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'ja-JP';

        // Select the best Japanese voice
        const jpVoice = voices.find(v => (v.lang === 'ja-JP' || v.lang === 'ja_JP') && v.name.includes('Google')) 
                       || voices.find(v => v.lang.includes('ja'));
        if (jpVoice) utterance.voice = jpVoice;

        // Kontras Suara Ekstrem
        if (type === 'A') {
            utterance.pitch = 0.5; // Sangat Berat (Pria/Atasan)
            utterance.rate = 0.75; // Lambat
        } else {
            utterance.pitch = 1.5; // Sangat Tinggi (Wanita/Junior)
            utterance.rate = 1.0;  // Normal
        }

        window.speechSynthesis.speak(utterance);
    }

    function changeSkenario(key) {
        activeKey = key;
        currentStep = 0;
        document.querySelectorAll('button[id^="tab-"]').forEach(b => b.classList.remove('tab-active'));
        document.getElementById('tab-' + key).classList.add('tab-active');
        render();
    }

    function handlePlayAudio() {
        const step = database[activeKey].script[currentStep];
        speak(step.jp, step.type);
    }

    function toggleElement(id) {
        const el = document.getElementById(id);
        if (el.classList.contains('hidden-content')) {
            el.classList.remove('hidden-content');
            el.classList.add('show-content');
            if (id === 'id-text') document.getElementById('rm-text').classList.add('show-content');
        } else {
            el.classList.remove('show-content');
            el.classList.add('hidden-content');
            if (id === 'id-text') document.getElementById('rm-text').classList.remove('show-content');
        }
    }

    function render() {
        const data = database[activeKey];
        const step = data.script[currentStep];
        
        // Header Update
        document.getElementById('header-bg').className = `px-8 py-8 text-white transition-all duration-700 shadow-lg ${data.color}`;
        document.getElementById('header-title').innerText = data.title;
        document.getElementById('header-desc').innerText = data.desc;
        document.getElementById('step-indicator').innerText = (currentStep + 1).toString().padStart(2, '0');

        // Character Card Update
        document.getElementById('avatar').innerText = step.icon;
        document.getElementById('char-name').innerText = step.char;
        
        const badge = document.getElementById('char-badge');
        badge.innerText = `SUARA TIPE ${step.type}`;
        badge.className = `absolute -top-4 px-6 py-2 rounded-full shadow-lg text-[9px] font-black tracking-[0.3em] text-white ${step.type === 'A' ? 'bg-slate-800' : 'bg-amber-600'}`;
        
        document.getElementById('voice-label').innerText = step.type === 'A' ? 'BERAT / RENDAH (OTORITAS)' : 'TINGGI / CERIA (PASIEN/STAF)';

        // Reset Text Displays
        const jp = document.getElementById('jp-text');
        jp.innerText = step.jp;
        jp.className = "hidden-content bg-slate-900 text-white rounded-3xl text-2xl font-bold leading-relaxed shadow-2xl border-b-8 border-amber-500";
        
        const id = document.getElementById('id-text');
        id.innerText = step.id;
        id.className = "hidden-content bg-amber-50 border-2 border-amber-100 rounded-2xl text-slate-700 text-sm font-bold italic";
        
        const rm = document.getElementById('rm-text');
        rm.innerText = step.rm;
        rm.className = "hidden-content font-mono text-[10px] text-slate-400 bg-slate-50 py-2 rounded-lg tracking-widest uppercase";

        // Progress Dots
        const dots = document.getElementById('dots-container');
        dots.innerHTML = '';
        data.script.forEach((_, i) => {
            const dot = document.createElement('div');
            dot.className = `h-1.5 rounded-full transition-all duration-300 ${i === currentStep ? 'w-10 bg-amber-500' : 'w-2 bg-slate-200'}`;
            dots.appendChild(dot);
        });
    }

    function nextStep() {
        if (currentStep < database[activeKey].script.length - 1) {
            currentStep++;
            render();
        } else {
            currentStep = 0;
            render();
        }
    }

    function prevStep() {
        if (currentStep > 0) {
            currentStep--;
            render();
        }
    }

    window.onload = () => changeSkenario('delay');
</script>
</body>
</html>
