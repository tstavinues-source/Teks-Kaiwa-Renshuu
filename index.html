<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master Percakapan Jepang - Multi Language v3</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@500;700;900&display=swap');
        body { font-family: 'Noto Sans JP', sans-serif; background-color: #0f172a; -webkit-tap-highlight-color: transparent; }
        .hidden-content { opacity: 0; transform: scale(0.95); pointer-events: none; transition: all 0.3s ease; height: 0; overflow: hidden; }
        .show-content { opacity: 1; transform: scale(1); pointer-events: auto; height: auto; transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); padding: 1.25rem; margin-top: 1rem; }
        .tab-active { background-color: #f59e0b !important; color: white !important; box-shadow: 0 4px 12px rgba(245, 158, 11, 0.4); }
        .lang-active { background-color: #334155; color: #f59e0b; border-color: #f59e0b; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen bg-slate-900">

<div class="max-w-md w-full bg-slate-50 min-h-screen shadow-2xl flex flex-col relative overflow-hidden md:rounded-[3rem] md:min-h-[850px]">
    
    <!-- Top Bar: Language & Branding -->
    <div class="bg-slate-900 px-6 pt-6 pb-2 flex justify-between items-center">
        <span class="text-[10px] font-black text-slate-500 tracking-[0.3em]">MASTER JP</span>
        <div class="flex gap-1 bg-slate-800 p-1 rounded-xl border border-slate-700">
            <button onclick="setLanguage('id')" id="btn-id" class="px-3 py-1.5 text-[9px] font-bold rounded-lg transition-all text-slate-400">ID</button>
            <button onclick="setLanguage('vi')" id="btn-vi" class="px-3 py-1.5 text-[9px] font-bold rounded-lg transition-all text-slate-400">VI</button>
        </div>
    </div>

    <!-- Navigation Tabs (Scenario Titles) -->
    <div class="bg-slate-900 pb-4 px-4 overflow-x-auto flex gap-2 no-scrollbar sticky top-0 z-50 border-b border-slate-800">
        <button onclick="changeSkenario('delay')" id="tab-delay" class="scenario-tab px-5 py-2 rounded-full text-[10px] font-black text-slate-400 bg-slate-800 transition-all uppercase tracking-widest shrink-0 border border-slate-700">...</button>
        <button onclick="changeSkenario('atm')" id="tab-atm" class="scenario-tab px-5 py-2 rounded-full text-[10px] font-black text-slate-400 bg-slate-800 transition-all uppercase tracking-widest shrink-0 border border-slate-700">...</button>
        <button onclick="changeSkenario('parkir')" id="tab-parkir" class="scenario-tab px-5 py-2 rounded-full text-[10px] font-black text-slate-400 bg-slate-800 transition-all uppercase tracking-widest shrink-0 border border-slate-700">...</button>
        <button onclick="changeSkenario('sampah')" id="tab-sampah" class="scenario-tab px-5 py-2 rounded-full text-[10px] font-black text-slate-400 bg-slate-800 transition-all uppercase tracking-widest shrink-0 border border-slate-700">...</button>
        <button onclick="changeSkenario('klinik')" id="tab-klinik" class="scenario-tab px-5 py-2 rounded-full text-[10px] font-black text-slate-400 bg-slate-800 transition-all uppercase tracking-widest shrink-0 border border-slate-700">...</button>
    </div>

    <!-- Header Area -->
    <div id="header-bg" class="px-8 py-6 text-white transition-all duration-700 shadow-lg relative overflow-hidden">
        <div class="absolute right-0 top-0 opacity-10 transform translate-x-4 -translate-y-2 scale-150" id="header-icon-large">🏢</div>
        <div class="flex justify-between items-start relative z-10">
            <div class="max-w-[80%]">
                <h1 id="header-title" class="text-xl font-black leading-tight tracking-tight mb-1">...</h1>
                <p id="header-desc" class="text-[10px] opacity-80 font-bold uppercase tracking-widest">...</p>
            </div>
            <div id="step-indicator" class="text-4xl font-black opacity-30 tracking-tighter">01</div>
        </div>
        <div id="situation-box" class="mt-4 bg-black/20 p-3 rounded-xl border border-white/10 text-[11px] font-medium leading-relaxed italic">
            ...
        </div>
    </div>

    <!-- Main Card Content -->
    <div class="flex-grow p-6 flex flex-col -mt-4">
        <div id="card-main" class="bg-white rounded-[2.5rem] p-8 shadow-xl border border-slate-100 min-h-[440px] flex flex-col items-center text-center relative">
            <div id="char-badge" class="absolute -top-4 px-6 py-2 rounded-full shadow-lg text-[10px] font-black tracking-[0.2em] text-white">...</div>
            <div id="avatar" class="w-20 h-20 rounded-2xl bg-slate-50 border-2 border-slate-100 flex items-center justify-center text-5xl mb-4 shadow-inner">...</div>
            <h2 id="char-name" class="text-lg font-black text-slate-800 mb-0.5">...</h2>
            <div id="action-prompt" class="text-[9px] bg-amber-100 text-amber-700 px-3 py-1 rounded-full font-black uppercase tracking-tighter mb-4">...</div>

            <div class="w-full space-y-3">
                <div id="jp-text" class="hidden-content bg-slate-900 text-white rounded-3xl text-2xl font-bold leading-relaxed shadow-2xl border-b-8 border-amber-500">...</div>
                <div id="id-text" class="hidden-content bg-amber-50 border-2 border-amber-100 rounded-2xl text-slate-700 text-sm font-bold italic">...</div>
                <div id="rm-text" class="hidden-content font-mono text-[10px] text-slate-400 bg-slate-50 py-2 rounded-lg tracking-widest uppercase">...</div>
            </div>
        </div>

        <div class="mt-6 space-y-3">
            <button onclick="handlePlayAudio()" class="w-full py-5 bg-teal-600 hover:bg-teal-700 text-white rounded-[2rem] shadow-xl transition-all active:scale-95 flex items-center justify-center gap-4 group">
                <span id="btn-listen" class="font-black text-xs uppercase tracking-widest">Dengarkan Suara</span>
                <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20"><path d="M9.383 3.076A1 1 0 0110 4v12a1 1 0 01-1.707.707L4.586 13H2a1 1 0 01-1-1V8a1 1 0 011-1h2.586l3.707-3.707a1 1 0 011.09-.217z"></path></svg>
            </button>
            <div class="grid grid-cols-2 gap-3">
                <button id="btn-show-jp" onclick="toggleElement('jp-text')" class="py-3.5 bg-slate-800 text-white rounded-2xl font-black text-[9px] uppercase tracking-widest shadow-lg active:scale-95">Lihat Jepang</button>
                <button id="btn-show-id" onclick="toggleElement('id-text')" class="py-3.5 bg-white border-2 border-slate-200 text-slate-400 rounded-2xl font-black text-[9px] uppercase tracking-widest shadow-md active:scale-95">Arti & Romaji</button>
            </div>
        </div>
    </div>

    <!-- Navigation Footer -->
    <div class="p-6 flex justify-between items-center">
        <button onclick="prevStep()" class="w-12 h-12 rounded-full bg-white shadow-md flex items-center justify-center text-slate-300 active:scale-75 transition-all">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M15 19l-7-7 7-7"/></svg>
        </button>
        <div id="dots-container" class="flex gap-1.5"></div>
        <button onclick="nextStep()" class="w-12 h-12 rounded-full bg-amber-500 shadow-lg flex items-center justify-center text-white active:scale-75 transition-all">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M9 5l7 7-7 7"/></svg>
        </button>
    </div>
</div>

                { char: "Nakamura", type: "A", icon: "👨‍💼", action: {id: "Tanya Alasan", vi: "Hỏi lý do"}, jp: "ミラーさん、どう したんですか。", id: "Miller-san, ada apa?", vi: "Anh Miller, có chuyện gì vậy?", rm: "Miraa-san, dou shita n desu ka?" },
                { char: "Miller", type: "B", icon: "🚌", action: {id: "Jelaskan Kejadian", vi: "Giải thích sự việc"}, jp: "実は 来る 途中で 事故が あって、バスが 遅れて しまったんです。", id: "Sebenarnya di tengah jalan ada kecelakaan, dan bus terlambat.", vi: "Thực ra trên đường đến đây có tai nạn nên xe buýt bị trễ.", rm: "Jitsu wa kuru tochu de jiko ga atte, basu ga okurete shimatta n desu." },
                { char: "Nakamura", type: "A", icon: "❓", action: {id: "Konfirmasi", vi: "Xác nhận"}, jp: "バスの 事故ですか。", id: "Kecelakaan bus?", vi: "Tai nạn xe buýt à?", rm: "Basu no jiko desu ka?" },
                { char: "Miller", type: "B", icon: "🚚", action: {id: "Detail Kecelakaan", vi: "Chi tiết tai nạn"}, jp: "いいえ。交差点で トラックと 車が ぶつかって、バスが 動かなかったんです。", id: "Bukan. Di persimpangan truk dan mobil tabrakan, bus tidak bergerak.", vi: "Không. Ở ngã tư, xe tải và ô tô đâm nhau nên xe buýt không di chuyển được.", rm: "Iie. Kousaten de torakku to kuruma ga butsukatte, basu ga ugokanakatta n desu." },
                { char: "Nakamura", type: "A", icon: "🤝", action: {id: "Empati", vi: "Đồng cảm"}, jp: "それは 大変でしたね。", id: "Wah, itu sulit ya.", vi: "Chuyện đó vất vả nhỉ.", rm: "Sore wa taihen deshita ne." },
                { char: "Nakamura", type: "A", icon: "📢", action: {id: "Info Kekhawatiran", vi: "Thông tin lo lắng"}, jp: "連絡が ないので、みんな 心配して いたんですよ。", id: "Karena tidak ada kabar, semuanya mengkhawatirkan Anda lho.", vi: "Vì không thấy liên lạc nên mọi người đã rất lo lắng đấy.", rm: "Renraku ga nai node, minna shinpai shite ita n desu yo." },
                { char: "Miller", type: "B", icon: "📱", action: {id: "Jelaskan HP Lupa", vi: "Quên điện thoại"}, jp: "電話したかったんですが、ケータイを うちに 忘れて しまって……。どうも すみませんでした。", id: "Saya ingin telepon tapi HP ketinggalan di rumah... Benar-benar mohon maaf.", vi: "Tôi đã muốn gọi điện nhưng lại quên điện thoại ở nhà... Thật sự xin lỗi.", rm: "Denwa shitakatta n desu ga, keetai o uchi ni wasurete shimatte... doumo sumimasen deshita." },

                { char: "Maria", type: "B", icon: "❓", action: {id: "Tanya Langkah Lanjut", vi: "Hỏi bước tiếp theo"}, jp: "はい、次は どう しますか。", id: "Iya, berikutnya bagaimana?", vi: "Vâng, tiếp theo phải làm gì?", rm: "Hai, tsugi wa dou shimasu ka?" },
                { char: "Petugas", type: "A", icon: "💰", action: {id: "Langkah 3 (Jumlah)", vi: "Bước 3 (Số tiền)"}, jp: "次は、金額を 押します。いくら 引き出しますか。", id: "Berikutnya, tekan jumlahnya. Mau tarik berapa?", vi: "Tiếp theo là nhấn số tiền. Chị muốn rút bao nhiêu?", rm: "Tsugi wa, kingaku o oshimasu. Ikura hikidashimasu ka?" },
                { char: "Maria", type: "B", icon: "💴", action: {id: "Sebutkan 50rb", vi: "Nói 50 nghìn"}, jp: "５万円ですが、５……。", id: "50.000 Yen, tapi tekan 5...", vi: "5 vạn Yên, 5...", rm: "Go-man-en desu ga, go..." },

                { char: "Maria", type: "B", icon: "🙏", action: {id: "Terima Kasih", vi: "Cảm ơn"}, jp: "はい。どうも ありがとう ございました。", id: "Iya. Terima kasih banyak.", vi: "Vâng. Cảm ơn ông rất nhiều.", rm: "Hai. Doumo arigatou gozaimashita." }

        parkir: {

            color: "bg-red-600",
            icon: "🚫",
            situation: {

            script: [

    let activeKey = 'delay';
    let currentStep = 0;
    let voices = [];

    function loadVoices() { voices = window.speechSynthesis.getVoices(); }
    window.speechSynthesis.onvoiceschanged = loadVoices;

    function setLanguage(lang) {
        currentLang = lang;
        document.getElementById('btn-id').classList.toggle('lang-active', lang === 'id');
        document.getElementById('btn-vi').classList.toggle('lang-active', lang === 'vi');
        
        // Update Static Buttons & Labels
        document.getElementById('btn-listen').innerText = uiText[lang].listen;
        document.getElementById('btn-show-jp').innerText = uiText[lang].showJp;
        document.getElementById('btn-show-id').innerText = uiText[lang].showId;

        // Update Nav Tabs
        document.getElementById('tab-delay').innerText = uiText[lang].tabs.delay;
        document.getElementById('tab-atm').innerText = uiText[lang].tabs.atm;
        document.getElementById('tab-parkir').innerText = uiText[lang].tabs.parkir;
        document.getElementById('tab-sampah').innerText = uiText[lang].tabs.sampah;
        document.getElementById('tab-klinik').innerText = uiText[lang].tabs.klinik;
        
        render();
    }

    function speak(text, type) {
        if (!window.speechSynthesis) return;
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'ja-JP';
        const jpVoice = voices.find(v => (v.lang === 'ja-JP' || v.lang === 'ja_JP')) || voices.find(v => v.lang.includes('ja'));
        if (jpVoice) utterance.voice = jpVoice;
        utterance.pitch = type === 'A' ? 0.8 : 1.2;
        utterance.rate = type === 'A' ? 0.85 : 1.0;
        window.speechSynthesis.speak(utterance);
    }

    function changeSkenario(key) {
        activeKey = key;
        currentStep = 0;
        document.querySelectorAll('.scenario-tab').forEach(b => b.classList.remove('tab-active'));
        document.getElementById('tab-' + key).classList.add('tab-active');
        render();
    }

    function handlePlayAudio() {
        const step = database[activeKey].script[currentStep];
        speak(step.jp, step.type);
    }

    function toggleElement(id) {
        const el = document.getElementById(id);
        const rm = document.getElementById('rm-text');
        if (el.classList.contains('hidden-content')) {
            el.classList.remove('hidden-content');
            el.classList.add('show-content');
            if (id === 'id-text') { rm.classList.add('show-content'); rm.classList.remove('hidden-content'); }
        } else {
            el.classList.remove('show-content');
            el.classList.add('hidden-content');
            if (id === 'id-text') { rm.classList.remove('show-content'); rm.classList.add('hidden-content'); }
        }
    }

    function render() {
        const data = database[activeKey];
        const step = data.script[currentStep];
        
        document.getElementById('header-bg').className = `px-8 py-6 text-white transition-all duration-700 shadow-lg relative overflow-hidden ${data.color}`;
        document.getElementById('header-title').innerText = data.title[currentLang];
        document.getElementById('header-desc').innerText = data.desc[currentLang];
        document.getElementById('step-indicator').innerText = (currentStep + 1).toString().padStart(2, '0');
        document.getElementById('situation-box').innerText = data.situation[currentLang];
        document.getElementById('header-icon-large').innerText = data.icon;
        document.getElementById('avatar').innerText = step.icon;
        document.getElementById('char-name').innerText = step.char;
        document.getElementById('action-prompt').innerText = step.action[currentLang];
        
        const badge = document.getElementById('char-badge');
        badge.innerText = `${uiText[currentLang].type} ${step.type}`;
        badge.className = `absolute -top-4 px-6 py-2 rounded-full shadow-lg text-[9px] font-black tracking-[0.2em] text-white ${step.type === 'A' ? 'bg-slate-800' : 'bg-amber-600'}`;

        document.getElementById('jp-text').innerText = step.jp;
        document.getElementById('id-text').innerText = step[currentLang]; 
        document.getElementById('rm-text').innerText = step.rm;

        // Reset visibility on step change
        ['jp-text', 'id-text', 'rm-text'].forEach(id => {
            document.getElementById(id).classList.add('hidden-content');
            document.getElementById(id).classList.remove('show-content');
        });

        const dots = document.getElementById('dots-container');
        dots.innerHTML = '';
        data.script.forEach((_, i) => {
            const dot = document.createElement('div');
            dot.className = `h-1.5 rounded-full transition-all duration-300 ${i === currentStep ? 'w-8 bg-amber-500' : 'w-1.5 bg-slate-200'}`;
            dots.appendChild(dot);
        });
    }

    function nextStep() {
        if (currentStep < database[activeKey].script.length - 1) {
            currentStep++;
            render();
        } else {
            currentStep = 0;
            render();
        }
    }

    function prevStep() {
        if (currentStep > 0) {
            currentStep--;
            render();
        }
    }

    window.onload = () => {
        loadVoices();
        setLanguage('id');
        changeSkenario('delay');
    }
</script>
